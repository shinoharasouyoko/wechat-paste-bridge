[package]
name = "wechat-paste-bridge"
version = "1.0.0"
description = "Local Codex article-package bridge for WeChat editor paste workflows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
arboard = "3.4"
clipboard-win = "5.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
zip = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
